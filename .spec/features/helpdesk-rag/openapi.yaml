openapi: 3.1.0
info:
  title: Helpdesk RAG API
  description: >
    Document upload/CRUD (with async post-commit RAG indexing) and semantic search API
    for the "Help Desk Inteligente com RAG" reference case.
    Covers CT-01 (upload), CT-02 (list / infinite scroll), CT-03 (update),
    CT-04 (delete), CT-05 (semantic search). Authentication/authorization is
    intentionally out of scope (RNF-08).
  version: "1.1"
servers:
  - url: /api
    description: Application-relative base path (single deployable, no multi-tenant routing)

paths:
  /documents:
    post:
      operationId: uploadDocument
      summary: Upload a document (PDF or TXT) for asynchronous RAG indexing
      description: >
        RF-01, RF-11, CT-01. Validates extension (.pdf/.txt), size (<=10485760 bytes),
        and content-type (secondary sanity signal; missing or application/octet-stream
        is accepted when the extension is valid) before any persistence. On success,
        persists document metadata with status=PENDING in a single transaction and
        publishes DocumentUploadedEvent for AFTER_COMMIT async processing (RF-02..RF-04).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF or TXT file to upload (max 10485760 bytes).
      responses:
        "201":
          description: Document accepted; metadata persisted with status=PENDING.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          description: >
            Validation error — invalid extension, size >10485760 bytes, or a
            content-type that explicitly contradicts the file extension (RF-11).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
    get:
      operationId: listDocuments
      summary: List non-deleted documents as an infinite-scroll batch (RF-05, CT-02)
      description: >
        Returns a fixed batch of up to 20 documents ordered by uploaded_at
        descending, excluding status=DELETED. The batch size (20) is fixed and
        not client-configurable (RNF-07); only the keyset cursor advances pagination.
      parameters:
        - name: cursor
          in: query
          required: false
          description: >
            Opaque keyset cursor returned as `nextCursor` by the previous
            response. Omit for the first batch.
          schema:
            type: string
      responses:
        "200":
          description: A batch of up to 20 documents, plus the cursor for the next batch (if any).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"

  /documents/{id}:
    put:
      operationId: updateDocument
      summary: Replace a document's file and trigger reprocessing (RF-06, RF-07, RF-11, CT-03)
      description: >
        Accepts a new file for an existing document. Rejected with 409 if the
        current status is PROCESSING (RF-07) or if the supplied optimistic-lock
        version no longer matches the persisted version (RF-12). On acceptance,
        sets status=PROCESSING and publishes DocumentUpdatedEvent; the post-commit
        listener physically deletes old chunks/vectors before reprocessing (RF-06).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The replacement PDF or TXT file (max 10485760 bytes).
      responses:
        "200":
          description: Update accepted; document transitioned to status=PROCESSING.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          description: Validation error on the replacement file (RF-11).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "404":
          description: No document exists for the supplied id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "409":
          description: >
            Conflict — either the document is currently PROCESSING (RF-07), or the
            optimistic-lock version supplied is stale (RF-12).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictErrorResponse"
    delete:
      operationId: deleteDocument
      summary: Soft-delete a document and physically remove its chunks/vectors (RF-08, RF-07, CT-04)
      description: >
        Sets status=DELETED and deleted_at, and physically deletes associated
        document_chunks rows. Rejected with 409 if the current status is
        PROCESSING (RF-07) or on a stale optimistic-lock version (RF-12).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Document soft-deleted; chunks/vectors physically removed.
        "404":
          description: No document exists for the supplied id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "409":
          description: >
            Conflict — either the document is currently PROCESSING (RF-07), or the
            optimistic-lock version supplied is stale (RF-12).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictErrorResponse"

  /search:
    post:
      operationId: searchDocuments
      summary: Semantic search over indexed document chunks (RF-10, RF-09, CT-05)
      description: >
        Converts the free-text question into an embedding, executes a native
        pgvector cosine-distance (`<=>`) query over document_chunks belonging to
        PROCESSED (non-deleted) documents, and returns results ordered by
        score descending. score = ROUND((1 - cosine_distance) * 100, 2),
        clamped to [0, 100].
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: >
            Search results ordered by score descending. An empty array is a
            valid response (no PROCESSED documents match).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResultItem"
        "400":
          description: Validation error — blank or missing question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

components:
  schemas:
    DocumentStatus:
      type: string
      description: Document lifecycle state (RF-01..RF-09).
      enum: [PENDING, PROCESSING, PROCESSED, ERROR, DELETED]

    DocumentResponse:
      type: object
      description: Full document representation returned by upload/update.
      required: [id, fileName, status, uploadedAt, version]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        status:
          $ref: "#/components/schemas/DocumentStatus"
        errorMessage:
          type: string
          nullable: true
          description: >
            Populated only when status=ERROR (e.g. "Nenhum conteúdo extraído
            do documento" for the zero-chunk case, RF-02/RF-04).
        uploadedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          format: int64
          description: Optimistic-lock version (RF-12).

    DocumentSummary:
      type: object
      description: Lightweight row shape used by the infinite-scroll list (RF-05).
      required: [id, fileName, status, uploadedAt]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        status:
          $ref: "#/components/schemas/DocumentStatus"
        uploadedAt:
          type: string
          format: date-time

    DocumentListResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/DocumentSummary"
        nextCursor:
          type: string
          nullable: true
          description: >
            Opaque keyset cursor to request the next batch. null when the
            currently loaded list already reached the end (RF-05).

    SearchRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
          description: Free-text question to embed and search against (RF-10).

    SearchResultItem:
      type: object
      required: [documentId, documentName, chunkText, score]
      properties:
        documentId:
          type: string
          format: uuid
        documentName:
          type: string
        chunkText:
          type: string
        score:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: >
            ROUND((1 - cosine_distance) * 100, 2), clamped to [0, 100],
            exactly 2 decimal places (RF-10, RNF-07).

    ValidationErrorResponse:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          enum: [400]
        error:
          type: string
          enum: ["Bad Request"]
        message:
          type: string
        path:
          type: string

    ConflictErrorResponse:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          enum: [409]
        error:
          type: string
          enum: ["Conflict"]
        message:
          type: string
          description: >
            Identifies the conflicting state explicitly — either "document is
            currently PROCESSING" (RF-07) or a stale optimistic-lock version
            (RF-12) — as two distinct message variants.
        path:
          type: string

    NotFoundErrorResponse:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          enum: [404]
        error:
          type: string
          enum: ["Not Found"]
        message:
          type: string
        path:
          type: string
