services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: helpdesk-rag-postgres
    environment:
      POSTGRES_DB: helpdesk_rag
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
    ports:
      - "5432:5432"
    volumes:
      - helpdesk-rag-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  helpdesk-rag-pgdata:
